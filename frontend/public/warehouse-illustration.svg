<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="truckCab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fb"/>
    </linearGradient>
    <linearGradient id="warehouseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="250" width="1000" height="70" fill="#1e293b"/>

  <g id="warehouse">
    <rect x="620" y="80" width="340" height="170" fill="url(#warehouseGrad)" rx="6"/>
    <rect x="620" y="80" width="340" height="22" fill="#33415b"/>
    <rect x="640" y="110" width="50" height="135" fill="#475569"/>
    <rect x="700" y="110" width="50" height="135" fill="#475569"/>
    <rect x="760" y="110" width="180" height="135" fill="#475569"/>
    <rect x="645" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="665" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="710" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="730" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="775" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="795" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="815" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="835" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="855" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="875" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="895" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="915" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="935" y="115" width="10" height="15" fill="#94a3b8"/>
    <rect x="770" y="230" width="200" height="20" fill="#33415b"/>
    <text x="810" y="235" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="bold">WAREHOUSE</text>
  </g>

  <g id="truck" transform="translate(60, 175)">
    <rect x="0" y="-25" width="220" height="85" rx="8" fill="url(#truckBody)"/>
    <rect x="0" y="-25" width="220" height="22" rx="8 8 0 0" fill="url(#truckCab)"/>
    <text x="110" y="10" text-anchor="middle" fill="white" font-size="14" font-weight="bold">CARGO TRUCK</text>

    <rect x="185" y="-15" width="5" height="60" fill="#cbd5e1" rx="2.5"/>
    <path d="M180,-15 L190,-15 L190,45 L180,45 Z" fill="#cbd5e1" rx="2"/>

    <rect x="20" y="10" width="180" height="50" fill="#93c5fd"/>
    <rect x="22" y="12" width="50" height="46" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="47" y="40" text-anchor="middle" fill="#92400e" font-size="14" font-weight="bold">SOFA</text>

    <rect x="82" y="12" width="50" height="46" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="107" y="40" text-anchor="middle" fill="#92400e" font-size="12" font-weight="bold">CHAIR</text>

    <rect x="142" y="12" width="50" height="46" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1"/>
    <text x="167" y="40" text-anchor="middle" fill="#92400e" font-size="12" font-weight="bold">DESK</text>

    <rect x="0" y="50" width="220" height="10" fill="#475569"/>
    <path d="M220,40 L235,50 L235,60 L220,60 Z" fill="#93c5fd"/>

    <circle cx="35" cy="100" r="16" fill="#1e293b"/>
    <circle cx="35" cy="100" r="10" fill="#94a3b8"/>
    <circle cx="175" cy="100" r="16" fill="#1e293b"/>
    <circle cx="175" cy="100" r="10" fill="#94a3b8"/>
  </g>

  <g id="worker1" transform="translate(330, 165)">
    <circle cx="0" cy="0" r="14" fill="url(#personGrad)"/>
    <rect x="-9" y="0" width="18" height="24" rx="9" fill="url(#personGrad)"/>
    <rect x="-24" y="24" width="48" height="4" rx="2" fill="url(#personGrad)"/>
    <rect x="-16" y="30" width="32" height="4" rx="2" fill="url(#personGrad)"/>
    <rect x="-24" y="34" width="12" height="16" rx="3" fill="url(#personGrad)"/>
    <rect x="12" y="34" width="12" height="16" rx="3" fill="url(#personGrad)"/>
    <polygon points="-9,-4 0,-14 9,-4" fill="#059669"/>
  </g>

  <g id="worker2" transform="translate(355, 185)">
    <circle cx="0" cy="0" r="11" fill="url(#personGrad)"/>
    <rect x="-7" y="0" width="14" height="18" rx="7" fill="url(#personGrad)"/>
    <rect x="-18" y="18" width="36" height="3" rx="1.5" fill="url(#personGrad)"/>
    <rect x="-12" y="22" width="24" height="3" rx="1.5" fill="url(#personGrad)"/>
    <rect x="-18" y="25" width="9" height="12" rx="2" fill="url(#personGrad)"/>
    <rect x="9" y="25" width="9" height="12" rx="2" fill="url(#personGrad)"/>
    <polygon points="-7,-3 0,-10 7,-3" fill="#059669"/>
  </g>

  <g id="worker3" transform="translate(310, 190)">
    <circle cx="0" cy="0" r="11" fill="url(#personGrad)"/>
    <rect x="-7" y="0" width="14" height="18" rx="7" fill="url(#personGrad)"/>
    <rect x="-18" y="18" width="36" height="3" rx="1.5" fill="url(#personGrad)"/>
    <rect x="-12" y="22" width="24" height="3" rx="1.5" fill="url(#personGrad)"/>
    <rect x="-18" y="25" width="9" height="12" rx="2" fill="url(#personGrad)"/>
    <rect x="9" y="25" width="9" height="12" rx="2" fill="url(#personGrad)"/>
    <polygon points="-7,-3 0,-10 7,-3" fill="#059669"/>
  </g>

  <g id="movingBox1" transform="translate(325, 155)">
    <rect x="0" y="0" width="36" height="36" rx="4" fill="url(#boxGrad)"/>
    <rect x="3" y="3" width="30" height="30" fill="#f59e0b" rx="2"/>
    <text x="18" y="22" text-anchor="middle" fill="white" font-size="8" font-weight="bold">SOFA</text>
  </g>

  <g id="movingBox2" transform="translate(345, 170)">
    <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#boxGrad)"/>
    <rect x="3" y="3" width="24" height="24" fill="#f59e0b" rx="2"/>
    <text x="15" y="20" text-anchor="middle" fill="white" font-size="7" font-weight="bold">CHAIR</text>
  </g>

  <g id="movingBox3" transform="translate(365, 185)">
    <rect x="0" y="0" width="26" height="26" rx="4" fill="url(#boxGrad)"/>
    <rect x="3" y="3" width="20" height="20" fill="#f59e0b" rx="2"/>
    <text x="13" y="18" text-anchor="middle" fill="white" font-size="6" font-weight="bold">DESK</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <line x1="400" y1="175" x2="540" y2="175" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="540,175 528,170 528,180" fill="#fbbf24"/>
  <text x="470" y="168" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">UNLOADING CONTAINERS</text>

  <text x="500" y="295" text-anchor="middle" fill="#94a3b8" font-size="14">Delivery truck with workers unpacking furniture containers into the warehouse</text>
</svg>
